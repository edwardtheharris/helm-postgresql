---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
  annotations:
    cert-manager.io/cluster-issuer: comms-svc-int
    cert-manager.io/common-name: {{ .Release.Name }}.breeze-blocks.net
    cert-manager.io/usages: key agreement,digital signature, server auth
spec:
  gatewayClassName: eg
  listeners:
    - name: {{ .Release.Name }}
      port: 5432
      protocol: TCP
      allowedRoutes:
        namespaces:
          from: All
      # tls:
      #   mode: Terminate
      #   certificateRefs:
      #     - name: {{ .Release.Name }}-tls
      #       kind: Secret
      #       group: ""

